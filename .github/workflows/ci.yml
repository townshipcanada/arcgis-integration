name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-pro:
    name: Validate ArcGIS Pro Toolbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python files
        run: |
          if [ -d "arcgis-pro" ]; then
            cd arcgis-pro
            python -m py_compile *.py 2>/dev/null || echo "No .py files in root"
            find . -name "*.py" -exec python -m py_compile {} \;
            echo "All Python files compile successfully"
          fi

  validate-experience-builder:
    name: Validate Experience Builder Widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Validate widget
        run: |
          if [ -d "experience-builder" ]; then
            cd experience-builder
            if [ -f "package.json" ]; then
              npm ci
              npm run build --if-present
              npm test --if-present
            fi
          fi
